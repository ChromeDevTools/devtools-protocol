<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to Chrome DevTools Protocol...</title>
    <script>
      (function () {
        var pathname = window.location.pathname || '';
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // Determine base prefix (e.g. /devtools-protocol/ or /debugger-protocol-viewer/)
        var basePrefix = '';
        if (pathname.startsWith('/devtools-protocol')) {
          basePrefix = '/devtools-protocol';
          pathname = pathname.slice('/devtools-protocol'.length);
        } else if (pathname.startsWith('/debugger-protocol-viewer')) {
          basePrefix = '/debugger-protocol-viewer';
          pathname = pathname.slice('/debugger-protocol-viewer'.length);
        }
        if (!pathname.startsWith('/')) {
          pathname = '/' + pathname;
        }

        // Extract member from hash (#method-foo, #event-bar, #type-baz) or search
        var member = '';
        var memberMatch = hash.match(/^#(?:method|type|event)-([\w-]+)/);
        if (memberMatch) {
          member = memberMatch[1];
        }

        // Split path segments
        var segments = pathname
          .split('/')
          .map(function (s) {
            return s.trim();
          })
          .filter(function (s) {
            return Boolean(s) && !s.endsWith('.html');
          });

        var hashRoute = '#/';

        if (segments.length > 0) {
          var firstSegment = segments[0].toLowerCase();
          var target = 'tot';
          var domain = null;

          if (firstSegment === '1-3' || firstSegment === '1-2' || firstSegment === 'stable') {
            target = 'stable';
            if (segments.length > 1) {
              domain = segments[1];
            }
          } else if (firstSegment === 'v8') {
            target = 'v8';
            if (segments.length > 1) {
              domain = segments[1];
            }
          } else if (firstSegment === 'tot') {
            target = 'tot';
            if (segments.length > 1) {
              domain = segments[1];
            }
          } else {
            // If first segment is not a version identifier, treat as domain
            domain = segments[0];
          }

          if (domain) {
            var memberSuffix = member ? '.' + member : '';
            if (target === 'tot') {
              hashRoute = '#/' + domain + memberSuffix;
            } else {
              hashRoute = '#/' + target + '/' + domain + memberSuffix;
            }
          } else if (target !== 'tot') {
            hashRoute = '#/' + target + '/';
          }
        }

        var targetUrl = (basePrefix || '') + '/' + hashRoute;
        try {
          window.location.replace(targetUrl);
        } catch (e) {
          window.location.href = targetUrl;
        }

        window.__resolvedTargetUrl = targetUrl;
      })();
    </script>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          'Helvetica Neue',
          Arial,
          sans-serif;
        margin: 40px auto;
        max-width: 600px;
        padding: 0 20px;
        color: #202124;
        line-height: 1.5;
      }
      a {
        color: #1a73e8;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Redirecting to Chrome DevTools Protocol...</h1>
    <p>
      If you are not redirected automatically within a few seconds, please follow
      <a id="redirect-link" href="#/">this link</a>.
    </p>
    <script>
      var link = document.getElementById('redirect-link');
      if (link && window.__resolvedTargetUrl) {
        link.href = window.__resolvedTargetUrl;
      }
    </script>
  </body>
</html>
