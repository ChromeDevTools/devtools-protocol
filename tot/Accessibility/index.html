<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to DevTools Protocol: Accessibility...</title>
  <script>
    (function() {
      var hash = window.location.hash || '';
      var member = '';
      var match = hash.match(/^#(?:method|type|event)-([\w-]+)/);
      if (match) member = '.' + match[1];
      window.location.replace('../../#/Accessibility' + member);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="../../#/Accessibility">Accessibility</a>...</p>
  <noscript>
    <ul>
      <!-- Static links to every command, event, and type for SEO, crawling, and grep -->
        <li><a href="../../#/Accessibility.disable">Accessibility.disable</a></li>

        <li><a href="../../#/Accessibility.getPartialAXTree">Accessibility.getPartialAXTree</a></li>

        <li><a href="../../#/Accessibility.queryAXTree">Accessibility.queryAXTree</a></li>
        <li><a href="../../#/Accessibility.loadComplete">Accessibility.loadComplete</a></li>
        <li><a href="../../#/Accessibility.nodesUpdated">Accessibility.nodesUpdated</a></li>

</body>
