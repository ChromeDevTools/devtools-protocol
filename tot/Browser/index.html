  <title>Redirecting to DevTools Protocol: Browser...</title>

    (function() {
      var hash = window.location.hash || '';
      var member = '';
      var match = hash.match(/^#(?:method|type|event)-([\w-]+)/);
      if (match) member = '.' + match[1];
      window.location.replace('../../#/Browser' + member);
    })();
  </script>
