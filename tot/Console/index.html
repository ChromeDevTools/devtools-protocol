<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to DevTools Protocol: Console...</title>
  <script>
    (function() {
      var hash = window.location.hash || '';
      var member = '';
      var match = hash.match(/^#(?:method|type|event)-([\w-]+)/);
      if (match) member = '.' + match[1];
      window.location.replace('../../#/Console' + member);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="../../#/Console">Console</a>...</p>
  <noscript>
    <ul>
      <!-- Static links to every command, event, and type for SEO, crawling, and grep -->
        <li><a href="../../#/Console.clearMessages">Console.clearMessages</a></li>
        <li><a href="../../#/Console.disable">Console.disable</a></li>
        <li><a href="../../#/Console.enable">Console.enable</a></li>
        <li><a href="../../#/Console.messageAdded">Console.messageAdded</a></li>
        <li><a href="../../#/Console.ConsoleMessage">Console.ConsoleMessage</a></li>
      </ul>
  </noscript>
</body>
</html>
