<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to DevTools Protocol: Fetch...</title>
  <script>
    (function() {
      var hash = window.location.hash || '';
      var member = '';
      var match = hash.match(/^#(?:method|type|event)-([\w-]+)/);
      if (match) member = '.' + match[1];
      window.location.replace('../../#/Fetch' + member);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="../../#/Fetch">Fetch</a>...</p>

</html>
